<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg-0: oklch(0.065 0.018 240);
    --bg-1: oklch(0.09 0.018 240);
    --bg-2: oklch(0.12 0.016 240);
    --bg-3: oklch(0.16 0.014 240);
    --border: oklch(0.22 0.025 220);
    --border-glow: oklch(0.28 0.06 195);
    --cyan: oklch(0.75 0.14 195);
    --cyan-dim: oklch(0.55 0.10 195);
    --cyan-faint: oklch(0.75 0.14 195 / 0.08);
    --amber: oklch(0.78 0.14 60);
    --amber-dim: oklch(0.58 0.10 60);
    --amber-faint: oklch(0.78 0.14 60 / 0.08);
    --red: oklch(0.65 0.18 25);
    --green: oklch(0.72 0.16 145);
    --green-faint: oklch(0.72 0.16 145 / 0.1);
    --text-1: oklch(0.92 0.01 220);
    --text-2: oklch(0.65 0.02 220);
    --text-3: oklch(0.42 0.02 220);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-0);
    color: var(--text-1);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
    background-image:
      linear-gradient(rgba(0,200,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  #root { height: 100vh; display: flex; flex-direction: column; }

  .panel {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
    opacity: 0.4;
  }

  .panel-title {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cyan);
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-2);
    flex-shrink: 0;
  }

  .panel-title .bracket { color: var(--text-3); }

  .glow-cyan { text-shadow: 0 0 12px var(--cyan); }
  .glow-amber { text-shadow: 0 0 12px var(--amber); }

  /* Dot indicators */
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot-cyan { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  .dot-dim { background: var(--text-3); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 2px; }

  /* Pulse animation */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pulse { animation: pulse 2s ease-in-out infinite; }
  .blink { animation: blink 1s step-end infinite; }

  /* Tweaks panel */
  #tweaks-panel {
    position: fixed;
    bottom: 20px; right: 20px;
    width: 260px;
    background: var(--bg-2);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,200,255,0.1);
    z-index: 10000;
    display: none;
    font-family: var(--mono);
    font-size: 11px;
  }
  #tweaks-panel.visible { display: block; animation: slideIn 0.2s ease; }
  #tweaks-panel .tweak-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--cyan);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  #tweaks-panel .tweak-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  #tweaks-panel label { display: flex; flex-direction: column; gap: 4px; color: var(--text-2); font-size: 10px; }
  #tweaks-panel select, #tweaks-panel input[type=range] {
    background: var(--bg-3); border: 1px solid var(--border);
    color: var(--text-1); padding: 4px 8px;
    border-radius: 4px; font-family: var(--mono); font-size: 10px;
    cursor: pointer; outline: none;
  }
  #tweaks-panel input[type=checkbox] { cursor: pointer; accent-color: var(--cyan); }

  /* Bar chart */
  .bar-container {
    display: flex; flex-direction: column; gap: 6px;
  }
  .bar-row {
    display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10px;
  }
  .bar-label { width: 70px; color: var(--text-2); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 6px; background: var(--bg-3); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .bar-val { width: 40px; text-align: right; color: var(--text-2); flex-shrink: 0; }

  /* Drop overlay */
  #drop-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 20000;
    background: oklch(0.065 0.018 240 / 0.88);
    backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    border: 2px dashed var(--cyan);
    animation: fadeIn 0.15s ease;
  }
  #drop-overlay.active { display: flex; }
  #drop-overlay .drop-icon {
    font-size: 48px; line-height: 1;
    filter: drop-shadow(0 0 16px var(--cyan));
  }
  #drop-overlay .drop-label {
    font-family: var(--mono); font-size: 14px;
    color: var(--cyan); letter-spacing: 0.2em;
    text-transform: uppercase;
    text-shadow: 0 0 20px var(--cyan);
  }
  #drop-overlay .drop-sub {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-3); letter-spacing: 0.1em;
  }

  /* Upload toast */
  #upload-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-2); border: 1px solid var(--border-glow);
    border-radius: 6px; padding: 10px 18px;
    font-family: var(--mono); font-size: 11px; color: var(--text-1);
    z-index: 19000; display: none; gap: 8px; align-items: center;
    box-shadow: 0 0 24px var(--cyan-faint);
    animation: slideIn 0.2s ease;
  }
  #upload-toast.visible { display: flex; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Drag & Drop Overlay -->
<div id="drop-overlay">
  <div class="drop-icon">🧠</div>
  <div class="drop-label">Ins Gehirn ablegen</div>
  <div class="drop-sub">Datei loslassen zum Speichern</div>
</div>

<!-- Upload Toast -->
<div id="upload-toast">
  <span id="upload-toast-icon">✓</span>
  <span id="upload-toast-msg"></span>
</div>

<div id="tweaks-panel">
  <div class="tweak-head">// TWEAKS</div>
  <div class="tweak-body">
    <label>
      Accent Color
      <select id="tw-accent" onchange="applyTweak()">
        <option value="195">Cyan</option>
        <option value="145">Green</option>
        <option value="275">Purple</option>
        <option value="60">Amber</option>
      </select>
    </label>
    <label>
      Layout Density
      <select id="tw-density" onchange="applyTweak()">
        <option value="normal">Normal</option>
        <option value="compact">Compact</option>
      </select>
    </label>
    <label style="flex-direction:row;align-items:center;gap:8px;">
      <input type="checkbox" id="tw-glow" onchange="applyTweak()" checked>
      Glow-Effekte
    </label>
    <label style="flex-direction:row;align-items:center;gap:8px;">
      <input type="checkbox" id="tw-grid" onchange="applyTweak()" checked>
      Grid-Hintergrund
    </label>
  </div>
</div>

<script>
  function applyTweak() {
    const hue = document.getElementById('tw-accent').value;
    const glow = document.getElementById('tw-glow').checked;
    const grid = document.getElementById('tw-grid').checked;
    const density = document.getElementById('tw-density').value;
    const root = document.documentElement;
    root.style.setProperty('--cyan', `oklch(0.75 0.14 ${hue})`);
    root.style.setProperty('--cyan-dim', `oklch(0.55 0.10 ${hue})`);
    root.style.setProperty('--cyan-faint', `oklch(0.75 0.14 ${hue} / 0.08)`);
    root.style.setProperty('--border-glow', `oklch(0.28 0.06 ${hue})`);
    document.body.style.backgroundImage = grid
      ? `linear-gradient(rgba(0,200,255,0.015) 1px, transparent 1px),linear-gradient(90deg, rgba(0,200,255,0.015) 1px, transparent 1px)`
      : 'none';
    document.querySelectorAll('.panel-title').forEach(el => {
      el.style.fontSize = density === 'compact' ? '8px' : '9px';
    });
  }

  window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode') {
      document.getElementById('tweaks-panel').classList.add('visible');
    } else if (e.data?.type === '__deactivate_edit_mode') {
      document.getElementById('tweaks-panel').classList.remove('visible');
    }
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');

  // ── Drag & Drop ────────────────────────────────────────────────────────────
  let _dragCounter = 0;
  const overlay   = document.getElementById('drop-overlay');
  const toast     = document.getElementById('upload-toast');
  const toastMsg  = document.getElementById('upload-toast-msg');
  const toastIcon = document.getElementById('upload-toast-icon');
  let _toastTimer = null;

  function showToast(msg, ok = true) {
    toastIcon.textContent = ok ? '✓' : '✕';
    toastIcon.style.color = ok ? 'var(--green)' : 'var(--red)';
    toastMsg.textContent  = msg;
    toast.classList.add('visible');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => toast.classList.remove('visible'), 3500);
  }

  document.addEventListener('dragenter', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    _dragCounter++;
    overlay.classList.add('active');
  });

  document.addEventListener('dragleave', e => {
    _dragCounter--;
    if (_dragCounter <= 0) { _dragCounter = 0; overlay.classList.remove('active'); }
  });

  document.addEventListener('dragover', e => e.preventDefault());

  document.addEventListener('drop', async e => {
    e.preventDefault();
    _dragCounter = 0;
    overlay.classList.remove('active');
    const files = Array.from(e.dataTransfer.files);
    if (!files.length) return;

    for (const file of files) {
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res  = await fetch('/api/brain/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.ok) {
          showToast(`🧠 "${data.name}" gespeichert (${data.size})`);
          window.__brainRefresh && window.__brainRefresh();
        } else {
          showToast(`Fehler: ${data.error || 'Unbekannt'}`, false);
        }
      } catch (err) {
        showToast(`Upload fehlgeschlagen: ${err.message}`, false);
      }
    }
  });
</script>

<script type="text/babel">

// ─── REAL-DATA HOOKS ──────────────────────────────────────────────────────────

function fmtMsgTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function useJarvisWS() {
  const [jarvisState, setJarvisState] = useState({
    status: 'offline', mode: 'text', current_task: null,
    uptime: 0, activity_log: [],
    stats: { total_messages: 0, total_tool_calls: 0 },
  });
  const [connected, setConnected] = useState(false);
  const wsRef    = useRef(null);
  const retryRef = useRef(null);

  const connect = useCallback(() => {
    if (wsRef.current?.readyState === WebSocket.OPEN) return;
    const ws = new WebSocket(`ws://${location.host}/ws`);
    wsRef.current = ws;
    ws.onopen  = () => { setConnected(true); clearTimeout(retryRef.current); };
    ws.onmessage = ({ data }) => {
      try {
        const msg = JSON.parse(data);
        if (msg.type === 'state_update') setJarvisState(msg.data);
      } catch {}
    };
    ws.onclose = () => {
      setConnected(false);
      setJarvisState(s => ({ ...s, status: 'offline' }));
      retryRef.current = setTimeout(connect, 3500);
    };
    ws.onerror = () => ws.close();
  }, []);

  useEffect(() => {
    connect();
    return () => { clearTimeout(retryRef.current); wsRef.current?.close(); };
  }, [connect]);

  return { jarvisState, connected };
}

function useCalendar() {
  const [calEvents, setCalEvents] = useState([]);
  const [calLoading, setCalLoading] = useState(true);
  const [calError, setCalError]     = useState(null);

  const load = useCallback(async () => {
    setCalLoading(true); setCalError(null);
    try {
      const res  = await fetch('/api/calendar');
      const data = await res.json();
      if (data.success) setCalEvents(data.events);
      else              setCalError(data.error);
    } catch { setCalError('Netzwerkfehler'); }
    finally { setCalLoading(false); }
  }, []);

  useEffect(() => {
    load();
    const id = setInterval(load, 60_000);
    return () => clearInterval(id);
  }, [load]);

  return { calEvents, calLoading, calError };
}

// Convert WebSocket activity_log → chat message format
function activityToMessages(log) {
  return [...log].reverse().map(item => ({
    id:    item.id,
    role:  item.type === 'user'      ? 'user'
         : item.type === 'assistant' ? 'assistant'
         : item.type === 'tool'      ? 'tool'
         : 'system',
    content: item.content,
    tool:  item.tool,
    ts:    fmtMsgTime(item.timestamp),
  }));
}

// ─── COMPONENTS (original, unchanged) ────────────────────────────────────────

function Header({ time, cpuLoad, memLoad, jarvisStatus, wsConnected }) {

  const statusDot   = jarvisStatus === 'idle'       ? 'green'
                    : jarvisStatus === 'processing'  ? 'amber'
                    : 'red';

                    : jarvisStatus === 'processing'  ? 'WORKING'
                    : 'OFFLINE';

    <header style={{
      display: 'flex', alignItems: 'center', gap: '24px',
      padding: '0 16px', height: '44px', flexShrink: 0,
      background: 'var(--bg-2)',
      borderBottom: '1px solid var(--border)',
      position: 'relative',
    }}>
      {/* Logo */}
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px', minWidth: '160px' }}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <polygon points="10,1 18,6 18,14 10,19 2,14 2,6" stroke="var(--cyan)" strokeWidth="1.2" fill="none"/>
          <polygon points="10,5 14,7.5 14,12.5 10,15 6,12.5 6,7.5" fill="var(--cyan)" opacity="0.15"/>
          <circle cx="10" cy="10" r="2" fill="var(--cyan)"/>
        </svg>
        <span style={{ fontFamily: 'var(--mono)', fontWeight: 700, fontSize: '14px', letterSpacing: '0.15em', color: 'var(--cyan)' }} className="glow-cyan">
          JARVIS
        </span>
        <span style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', letterSpacing: '0.1em' }}>v2.4.1</span>
      </div>

      {/* Divider */}
      <div style={{ width: '1px', height: '20px', background: 'var(--border)' }}/>

      {/* Status chips — first chip is now live */}
      <div style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
        <StatusChip dot={statusDot} label={statusLabel} pulse={jarvisStatus === 'idle'} />
        <StatusChip dot={wsConnected ? 'cyan' : 'dim'} label={wsConnected ? `${MCP_SERVERS.filter(s=>s.status==='connected').length} MCP` : 'WS OFFLINE'} />
        <StatusChip dot="amber" label="GPT-4o" />
      </div>

      {/* Spacer */}
      <div style={{ flex: 1 }}/>

      {/* Metrics */}
      <div style={{ display: 'flex', gap: '20px', alignItems: 'center', fontFamily: 'var(--mono)', fontSize: '10px', color: 'var(--text-2)' }}>

        <MiniMetric label="MEM" val={memLoad} unit="%" color={memLoad > 80 ? 'var(--amber)' : 'var(--cyan)'} />
        <div style={{ color: 'var(--text-3)' }}>|</div>
        <span style={{ color: 'var(--text-1)' }}>{time}</span>
        <span style={{ color: 'var(--text-3)', fontSize: '9px' }}>
          {new Date().toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })}
        </span>
      </div>

}

function StatusChip({ dot, label, pulse }) {
  const colors = { green: 'var(--green)', cyan: 'var(--cyan)', amber: 'var(--amber)', red: 'var(--red)', dim: 'var(--text-3)' };
  const c = colors[dot] || 'var(--text-3)';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: '5px', fontFamily: 'var(--mono)', fontSize: '9px', letterSpacing: '0.1em', color: c }}>
      <div className={pulse ? 'pulse' : ''} style={{ width: 5, height: 5, borderRadius: '50%', background: c, boxShadow: dot !== 'dim' ? `0 0 5px ${c}` : 'none' }}/>
      {label}
    </div>
  );
}

function MiniMetric({ label, val, unit, color }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
      <span style={{ color: 'var(--text-3)' }}>{label}</span>
      <span style={{ color }}>{val}{unit}</span>
    </div>
  );
}

// ─── URL RENDERER ────────────────────────────────────────────────────────────

function renderContent(content, openViewer) {
  const urlRe = /https?:\/\/[^\s\])"'<>\\]+/g;
  const parts = [];
  let last = 0, m;
  while ((m = urlRe.exec(content)) !== null) {
    if (m.index > last) parts.push(content.slice(last, m.index));
    parts.push({ url: m[0] });
    last = m.index + m[0].length;
  }
  if (last < content.length) parts.push(content.slice(last));
  if (parts.length === 1 && typeof parts[0] === 'string') return content;
  return parts.map((p, i) => {
    if (typeof p === 'string') return <span key={i}>{p}</span>;
    return (
      <span key={i} style={{ display: 'inline-flex', alignItems: 'baseline', gap: '3px', flexWrap: 'wrap' }}>
        <span style={{ color: 'var(--cyan)', wordBreak: 'break-all' }}>{p.url}</span>
        {openViewer && (
          <button
            onClick={() => openViewer(p.url)}
            style={{
              background: 'var(--cyan-faint)', border: '1px solid var(--cyan-dim)',
              color: 'var(--cyan)', borderRadius: '2px', padding: '1px 5px',
              fontFamily: 'var(--mono)', fontSize: '8px', cursor: 'pointer',
              letterSpacing: '0.08em', flexShrink: 0, lineHeight: 1.4,
            }}
          >↗ ÖFFNEN</button>
        )}
      </span>
    );
  });
}

function TextFileViewer({ path }) {
  const [content, setContent] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    setContent(null); setErr(null);
    fetch(`/api/view/file?path=${encodeURIComponent(path)}`)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then(setContent)
      .catch(e => setErr(e.message));
  }, [path]);
  if (err) return (
    <div style={{ padding: '24px', fontFamily: 'var(--mono)', fontSize: '12px', color: 'var(--red)', textAlign: 'center' }}>
      Fehler: {err}
    </div>
  );
  if (!content) return (
    <div style={{ padding: '24px', fontFamily: 'var(--mono)', fontSize: '11px', color: 'var(--text-3)', textAlign: 'center', letterSpacing: '0.1em' }}>
      Lade…
    </div>
  );
  const lines = content.split('\n');
  return (
    <div style={{ height: '100%', overflowY: 'auto', overflowX: 'auto' }}>
      <table style={{ borderCollapse: 'collapse', minWidth: '100%' }}>
        <tbody>
          {lines.map((line, i) => (
            <tr key={i} style={{ ':hover': { background: 'var(--bg-3)' } }}>
              <td style={{
                padding: '1px 12px 1px 16px', fontFamily: 'var(--mono)', fontSize: '11px',
                color: 'var(--text-3)', textAlign: 'right', userSelect: 'none',
                borderRight: '1px solid var(--border)', minWidth: '44px', verticalAlign: 'top',
                lineHeight: '1.7',

              <td style={{
                padding: '1px 16px', fontFamily: 'var(--mono)', fontSize: '12px',
                color: 'var(--text-1)', whiteSpace: 'pre', lineHeight: '1.7',
              }}>{line}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );

// ─── CHAT ────────────────────────────────────────────────────────────────────

function ChatPanel({ liveMessages, openViewer, viewerOpen }) {
  const [localMessages, setLocalMessages] = useState(INIT_MESSAGES);
  const [input, setInput]   = useState('');
  const [thinking, setThinking] = useState(false);
  const [thinkText, setThinkText] = useState('');
  const bottomRef = useRef(null);
  const nextId    = useRef(5);

  const messages = liveMessages !== null ? liveMessages : localMessages;

  useEffect(() => {
    if (bottomRef.current) {
      bottomRef.current.parentElement.scrollTop = bottomRef.current.offsetTop;
    }
  }, [messages.length, thinking]);

  const now = () => {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };

  const send = useCallback(async () => {
    if (!input.trim() || thinking) return;
    const text = input.trim();
    setInput('');

    // /view command — open viewer locally without sending to JARVIS
    if (text.startsWith('/view ')) {
      const target = text.slice(6).trim();
      if (target && openViewer) openViewer(target);
      return;
    }

    if (liveMessages !== null) {
      setThinking(true);
      setThinkText('Wird gesendet…');
      try {
        await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
      } finally {
        setThinking(false);
      }
    } else {
      const userMsg = { id: nextId.current++, role: 'user', content: text, ts: now() };
      setLocalMessages(m => [...m, userMsg]);
      setThinking(true);
      const steps = ['Analysiere...', 'Tool-Calls werden vorbereitet...', 'Antwort wird generiert...'];
      let i = 0;
      setThinkText(steps[0]);
      const tick = setInterval(() => { i++; if (i < steps.length) setThinkText(steps[i]); }, 600);
      setTimeout(() => {
        clearInterval(tick);
        setThinking(false);
        const resp = JARVIS_RESPONSES[Math.floor(Math.random()*JARVIS_RESPONSES.length)];
        setLocalMessages(m => [...m, { id: nextId.current++, role: 'assistant', content: resp, ts: now(), tools: Math.random()>0.5?['memory.query','filesystem.read']:undefined }]);
      }, 1800);
    }
  }, [input, thinking, liveMessages, openViewer]);

  const isLive = liveMessages !== null;

  return (
    <div className="panel" style={{
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
      flex: viewerOpen ? '0 0 320px' : 1,
      transition: 'flex-basis 0.25s ease',
    }}>
      <div className="panel-title" style={{ justifyContent: 'space-between' }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
          <span className="bracket">[</span>CHAT<span className="bracket">]</span>
        </span>
        <span style={{ color: isLive ? 'var(--green)' : 'var(--text-3)', fontSize: '9px' }}>
          {isLive ? `● LIVE · ${messages.length} msgs` : `${messages.length} msgs`}
        </span>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '12px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
        {messages.length === 0 && (
          <div style={{ textAlign: 'center', fontFamily: 'var(--mono)', fontSize: '10px', color: 'var(--text-3)', marginTop: '40px', letterSpacing: '0.1em' }}>
            — Warte auf JARVIS-Aktivität —
          </div>
        )}
        {messages.map(msg => <ChatMessage key={msg.id} msg={msg} openViewer={openViewer} />)}
        {thinking && <ThinkingIndicator text={thinkText} />}
        <div ref={bottomRef} />
      </div>

      {/* Input */}
      <div style={{ padding: '10px 12px', borderTop: '1px solid var(--border)', display: 'flex', gap: '8px', alignItems: 'flex-end', background: 'var(--bg-2)' }}>
        <div style={{ flex: 1, position: 'relative' }}>
          <div style={{ position: 'absolute', left: '10px', top: '50%', transform: 'translateY(-50%)', fontFamily: 'var(--mono)', fontSize: '11px', color: 'var(--cyan)', pointerEvents: 'none' }}>›</div>
          <input
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && !e.shiftKey && send()}
            placeholder="/view <url|pfad> oder Anfrage eingeben…"
            style={{
              width: '100%', background: 'var(--bg-3)',
              border: '1px solid var(--border)',
              borderColor: input ? 'var(--border-glow)' : 'var(--border)',
              borderRadius: '4px', padding: '8px 10px 8px 24px',
              fontFamily: 'var(--mono)', fontSize: '12px', color: 'var(--text-1)',
              outline: 'none', transition: 'border-color 0.2s',
              boxShadow: input ? '0 0 10px var(--cyan-faint)' : 'none',
            }}
          />
        </div>
        <button onClick={send} disabled={!input.trim() || thinking} style={{
          background: input.trim() && !thinking ? 'var(--cyan-faint)' : 'transparent',
          border: '1px solid',
          borderColor: input.trim() && !thinking ? 'var(--cyan)' : 'var(--border)',
          color: input.trim() && !thinking ? 'var(--cyan)' : 'var(--text-3)',
          padding: '8px 14px', borderRadius: '4px',
          fontFamily: 'var(--mono)', fontSize: '10px', letterSpacing: '0.1em',
          cursor: input.trim() && !thinking ? 'pointer' : 'default',
          transition: 'all 0.2s', flexShrink: 0,
        }}>
          {thinking ? '...' : 'SEND'}
        </button>
      </div>
    </div>
  );
}

function ChatMessage({ msg, openViewer }) {
  const isUser   = msg.role === 'user';

        <span style={{ fontFamily: 'var(--mono)', fontSize: '9px', padding: '1px 5px', background: 'var(--amber-faint)', border: '1px solid var(--amber-dim)', borderRadius: '3px', color: 'var(--amber)' }}>{msg.tool}</span>
        <span style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)' }}>{msg.ts}</span>
      </div>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', alignItems: isUser ? 'flex-end' : 'flex-start', animation: 'slideIn 0.25s ease' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '6px', flexDirection: isUser ? 'row-reverse' : 'row' }}>
        <div style={{
          width: 22, height: 22, borderRadius: isUser ? '4px' : '50%',
          background: isUser ? 'var(--bg-3)' : 'var(--cyan-faint)',
          border: `1px solid ${isUser ? 'var(--border)' : 'var(--cyan-dim)'}`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: 'var(--mono)', fontSize: '9px',
          color: isUser ? 'var(--text-2)' : 'var(--cyan)',
        }}>
          {isUser ? 'U' : 'J'}
        </div>
        <span style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)' }}>{msg.ts}</span>
        {!isUser && msg.tools && (
          <div style={{ display: 'flex', gap: '4px' }}>
            {msg.tools.map(t => (
              <span key={t} style={{ fontFamily: 'var(--mono)', fontSize: '8px', padding: '1px 5px', background: 'var(--amber-faint)', border: '1px solid var(--amber-dim)', borderRadius: '3px', color: 'var(--amber)' }}>{t}</span>
            ))}
          </div>
        )}
      </div>
      <div style={{
        maxWidth: '85%', padding: '8px 12px',
        background: isUser ? 'var(--bg-3)' : 'var(--bg-2)',
        border: `1px solid ${isUser ? 'var(--border)' : 'var(--border-glow)'}`,
        borderRadius: isUser ? '8px 2px 8px 8px' : '2px 8px 8px 8px',
        fontFamily: 'var(--mono)', fontSize: '12px', lineHeight: '1.6',
        color: 'var(--text-1)',
        whiteSpace: 'pre-wrap',
        boxShadow: isUser ? 'none' : '0 0 15px var(--cyan-faint)',
      }}>
        {renderContent(msg.content, openViewer)}
      </div>
    </div>
  );
}

function useBrainFiles() {
  const [files, setFiles]     = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    try {
      const res  = await fetch('/api/brain/list');
      const data = await res.json();
      setFiles(data.files || []);
    } catch {}
    finally { setLoading(false); }
  }, []);

  useEffect(() => {
    load();
    // Globaler Refresh-Hook für Drag & Drop
    window.__brainRefresh = load;
    return () => { window.__brainRefresh = null; };
  }, [load]);

  return { files, loading, reload: load };
}

function BrainPanel() {
  const { files, loading, reload } = useBrainFiles();
  const [deleting, setDeleting]    = useState(null);

  const fmtSize = bytes =>
    bytes >= 1_048_576 ? `${(bytes/1_048_576).toFixed(1)} MB`
    : bytes >= 1024    ? `${Math.round(bytes/1024)} KB`
    : `${bytes} B`;

  const fmtDate = iso => {
    const d = new Date(iso);
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  };

  const ext = name => name.includes('.') ? name.split('.').pop().toLowerCase() : '?';
  const extColor = e => ({
    pdf:'var(--red)', md:'var(--cyan)', txt:'var(--text-2)',
    py:'var(--green)', js:'var(--amber)', ts:'var(--amber)',
    csv:'var(--green)', json:'var(--amber)',
  }[e] || 'var(--text-3)');

  const deleteFile = async (name) => {
    setDeleting(name);
    try {
      await fetch(`/api/brain/file?name=${encodeURIComponent(name)}`, { method: 'DELETE' });
      reload();
    } finally { setDeleting(null); }
  };

  return (
    <div className="panel" style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
      <div className="panel-title" style={{ justifyContent: 'space-between' }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
          <span style={{ fontSize: '11px' }}>🧠</span>
          <span className="bracket">[</span>GEHIRN<span className="bracket">]</span>
        </span>
        <span style={{ color: 'var(--text-3)', fontSize: '9px' }}>
          {loading ? '…' : `${files.length} Datei${files.length !== 1 ? 'en' : ''}`}
        </span>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '6px 0' }}>
        {loading && (
          <div style={{ padding: '16px 12px', fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', textAlign: 'center', letterSpacing: '0.1em' }}>
            Lade…
          </div>
        )}
        {!loading && files.length === 0 && (
          <div style={{ padding: '20px 12px', textAlign: 'center', display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center' }}>
            <div style={{ fontSize: '28px', opacity: 0.3 }}>🧠</div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', letterSpacing: '0.1em', lineHeight: 1.6 }}>
              Noch leer.<br/>Dateien hier hinziehen.
            </div>
          </div>
        )}
        {files.map(f => (
          <div key={f.name} style={{
            padding: '5px 10px',
            display: 'flex', alignItems: 'center', gap: '8px',
            borderBottom: '1px solid var(--border)',
            transition: 'background 0.1s',
          }}
          onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-3)'}
          onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
          >
            {/* Ext badge */}
            <div style={{
              flexShrink: 0, width: '28px', textAlign: 'center',
              fontFamily: 'var(--mono)', fontSize: '7px', fontWeight: 700,
              letterSpacing: '0.05em', padding: '2px 3px',
              border: `1px solid ${extColor(ext(f.name))}`,
              borderRadius: '3px', color: extColor(ext(f.name)),
              textTransform: 'uppercase',
            }}>
              {ext(f.name).slice(0,4)}
            </div>

            {/* Name + meta */}
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontFamily: 'var(--mono)', fontSize: '10px', color: 'var(--text-1)',
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }} title={f.name}>{f.name}</div>
              <div style={{ fontFamily: 'var(--mono)', fontSize: '8px', color: 'var(--text-3)' }}>
                {fmtSize(f.size)} · {fmtDate(f.modified)}
              </div>
            </div>

            {/* Delete */}
            <button
              onClick={() => deleteFile(f.name)}
              disabled={deleting === f.name}
              title="Löschen"
              style={{
                flexShrink: 0, background: 'transparent',
                border: 'none', color: 'var(--text-3)',
                cursor: 'pointer', fontSize: '11px', padding: '2px 4px',
                borderRadius: '3px', lineHeight: 1,
                opacity: deleting === f.name ? 0.4 : 1,
              }}
              onMouseEnter={e => e.currentTarget.style.color = 'var(--red)'}
              onMouseLeave={e => e.currentTarget.style.color = 'var(--text-3)'}
            >✕</button>
          </div>
        ))}
      </div>

      {/* Drop hint */}
      <div style={{
        padding: '6px 12px', borderTop: '1px solid var(--border)',
        fontFamily: 'var(--mono)', fontSize: '8px', color: 'var(--text-3)',
        textAlign: 'center', letterSpacing: '0.08em',
      }}>
        Drag &amp; Drop zum Hinzufügen
      </div>
    </div>
  );
}

// ─── RIGHT PANEL ─────────────────────────────────────────────────────────────

function RightPanel({ calEvents, calLoading, calError }) {
  return (
    <div style={{ width: '240px', flexShrink: 0, display: 'flex', flexDirection: 'column', gap: '8px' }}>
      <CalendarPanel calEvents={calEvents} calLoading={calLoading} calError={calError} />
      <BrainPanel />
    </div>
  );
}

function CalendarPanel({ calEvents, calLoading, calError }) {
  const now   = new Date();
  const year  = now.getFullYear();
  const month = now.getMonth();
  const monthNames = ['JAN','FEB','MRZ','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];

  const [selected, setSelected] = useState(now.getDate());

  // Build day → events map from real API data
  const events = {};
  calEvents.forEach(ev => {
    const d = new Date(ev.start.includes('T') ? ev.start : ev.start + 'T00:00:00');
    if (d.getFullYear() === year && d.getMonth() === month) {
      const day = d.getDate();
      if (!events[day]) events[day] = [];
      events[day].push({
        t: ev.start.includes('T')
          ? new Date(ev.start).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
          : 'Ganztägig',
        label:    ev.summary,
        location: ev.location,
        color:    d.toDateString() === now.toDateString() ? 'var(--cyan)' : 'var(--amber)',
      });
    }
  });

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay    = new Date(year, month, 1).getDay();
  const startPad    = firstDay === 0 ? 6 : firstDay - 1;
  const dayNames    = ['Mo','Di','Mi','Do','Fr','Sa','So'];

  return (
    <div className="panel" style={{ flex: '0 0 auto' }}>
      <div className="panel-title">
        <span className="bracket">[</span>KALENDER — {monthNames[month]} {year}<span className="bracket">]</span>
      </div>

      {calLoading && (
        <div style={{ padding: '12px', fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', textAlign: 'center', letterSpacing: '0.1em' }}>
          Synchronisiere…
        </div>
      )}
      {calError && !calLoading && (
        <div style={{ padding: '8px 12px', fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--red)', textAlign: 'center' }}>
          {calError}
        </div>
      )}

      <div style={{ padding: '8px 10px' }}>
        {/* Day headers */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', marginBottom: '4px' }}>
          {dayNames.map(d => (
            <div key={d} style={{ textAlign: 'center', fontFamily: 'var(--mono)', fontSize: '8px', color: 'var(--text-3)', padding: '2px 0' }}>{d}</div>
          ))}
        </div>
        {/* Days */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: '2px' }}>
          {Array(startPad).fill(null).map((_, i) => <div key={`pad-${i}`}/>)}
          {Array.from({length: daysInMonth}, (_, i) => i+1).map(d => {
            const isToday    = d === now.getDate();
            const isSelected = d === selected;
            const hasEvent   = !!events[d];
            return (
              <div key={d} onClick={() => setSelected(d)} style={{
                textAlign: 'center', padding: '3px 0',
                fontFamily: 'var(--mono)', fontSize: '10px',
                borderRadius: '3px', cursor: 'pointer',
                background: isSelected ? 'var(--cyan-faint)' : 'transparent',
                color: isToday ? 'var(--cyan)' : 'var(--text-2)',
                border: isToday ? '1px solid var(--cyan-dim)' : '1px solid transparent',
                fontWeight: isToday ? 700 : 400,
                position: 'relative',
                transition: 'all 0.1s',
              }}>
                {d}
                {hasEvent && <div style={{ position: 'absolute', bottom: '1px', left: '50%', transform: 'translateX(-50%)', width: '3px', height: '3px', borderRadius: '50%', background: events[d][0].color }}/>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Events for selected day */}
      {events[selected] ? (
        <div style={{ borderTop: '1px solid var(--border)', padding: '8px 10px', display: 'flex', flexDirection: 'column', gap: '6px' }}>
          {events[selected].map((ev, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: '8px' }}>
              <div style={{ width: '2px', height: '22px', background: ev.color, borderRadius: '1px', flexShrink: 0, marginTop: '2px' }}/>
              <div>
                <div style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)' }}>{ev.t}</div>
                <div style={{ fontFamily: 'var(--sans)', fontSize: '11px', color: 'var(--text-1)' }}>{ev.label}</div>
                {ev.location && <div style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)' }}>◈ {ev.location}</div>}
              </div>
            </div>
          ))}
        </div>
      ) : !calLoading && (
        <div style={{ borderTop: '1px solid var(--border)', padding: '8px 10px', fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', textAlign: 'center' }}>
          Keine Termine am {selected}.{String(month+1).padStart(2,'0')}.
        </div>
      )}
    </div>
  );
}

function TokenPanel() {
  const totalUsed  = MONTHLY_USED;
  const totalLimit = MONTHLY_LIMIT;
  const pct  = (totalUsed / totalLimit * 100).toFixed(1);
  const maxDay = Math.max(...TOKEN_HISTORY.map(d => d.input + d.output));
  const cost = (totalUsed / 1_000_000 * 5).toFixed(2);

  return (
    <div className="panel" style={{ flex: 1 }}>
      <div className="panel-title">
        <span className="bracket">[</span>OPENAI TOKENS<span className="bracket">]</span>
      </div>
      <div style={{ padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: '10px' }}>

        {/* Monthly usage */}
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--mono)', fontSize: '9px', marginBottom: '4px' }}>
            <span style={{ color: 'var(--text-3)' }}>MONAT</span>
            <span style={{ color: 'var(--cyan)' }}>{(totalUsed/1000).toFixed(0)}k / {(totalLimit/1000000).toFixed(0)}M</span>
          </div>
          <div style={{ height: '6px', background: 'var(--bg-3)', borderRadius: '3px', overflow: 'hidden' }}>
            <div style={{ width: `${pct}%`, height: '100%', background: 'linear-gradient(90deg, var(--cyan-dim), var(--cyan))', borderRadius: '3px', boxShadow: '0 0 8px var(--cyan-faint)' }}/>
          </div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', marginTop: '3px' }}>{pct}% — ca. ${cost} diese Woche</div>
        </div>

        {/* Stats */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px' }}>
          <StatBox label="INPUT"  val={(TOKEN_HISTORY.reduce((a,d)=>a+d.input,0)/1000).toFixed(0)+'k'}  color="var(--cyan)" />
          <StatBox label="OUTPUT" val={(TOKEN_HISTORY.reduce((a,d)=>a+d.output,0)/1000).toFixed(0)+'k'} color="var(--green)" />
          <StatBox label="CACHED" val={(TOKEN_HISTORY.reduce((a,d)=>a+d.cached,0)/1000).toFixed(0)+'k'} color="var(--amber)" />
          <StatBox label="KOSTEN" val={'$'+cost} color="var(--text-1)" />
        </div>

        {/* Daily chart */}
        <div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', marginBottom: '6px', letterSpacing: '0.1em' }}>7-TAGE VERLAUF</div>
          <div style={{ display: 'flex', gap: '4px', alignItems: 'flex-end', height: '48px' }}>
            {TOKEN_HISTORY.map((d, i) => {
              const h = Math.round(((d.input + d.output) / maxDay) * 44);
              const isToday = i === 4;
              return (
                <div key={d.day} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '3px' }}>
                  <div style={{ width: '100%', height: `${h}px`, background: isToday ? 'var(--cyan)' : 'var(--bg-3)', borderRadius: '2px 2px 0 0', boxShadow: isToday ? '0 0 8px var(--cyan-faint)' : 'none', transition: 'height 0.5s ease', position: 'relative', overflow: 'hidden' }}>
                    {isToday && <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, var(--cyan), var(--cyan-dim))'}}/>}
                  </div>
                  <span style={{ fontFamily: 'var(--mono)', fontSize: '8px', color: isToday ? 'var(--cyan)' : 'var(--text-3)' }}>{d.day}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Model breakdown */}
        <div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: '9px', color: 'var(--text-3)', marginBottom: '6px', letterSpacing: '0.1em' }}>MODELLE</div>
          <div className="bar-container">
            <div className="bar-row">
              <span className="bar-label">gpt-4o</span>
              <div className="bar-track"><div className="bar-fill" style={{ width: '68%', background: 'var(--cyan)' }}/></div>
              <span className="bar-val">68%</span>
            </div>
            <div className="bar-row">
              <span className="bar-label">gpt-4o-mini</span>
              <div className="bar-track"><div className="bar-fill" style={{ width: '24%', background: 'var(--green)' }}/></div>
              <span className="bar-val">24%</span>
            </div>
            <div className="bar-row">
              <span className="bar-label">o1</span>
              <div className="bar-track"><div className="bar-fill" style={{ width: '8%', background: 'var(--amber)' }}/></div>
              <span className="bar-val">8%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function StatBox({ label, val, color }) {
  return (
    <div style={{ background: 'var(--bg-3)', border: '1px solid var(--border)', borderRadius: '4px', padding: '6px 8px' }}>
      <div style={{ fontFamily: 'var(--mono)', fontSize: '8px', color: 'var(--text-3)', letterSpacing: '0.1em' }}>{label}</div>
      <div style={{ fontFamily: 'var(--mono)', fontSize: '14px', fontWeight: 600, color, marginTop: '2px' }}>{val}</div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────

function App() {
  const [time, setTime]   = useState('');
  const [cpu, setCpu]     = useState(34);
  const [mem, setMem]     = useState(62);
  const [activeServer, setActiveServer] = useState(null);
  const [viewer, setViewer] = useState(null);

  const { jarvisState, connected }          = useJarvisWS();
  const { calEvents, calLoading, calError } = useCalendar();

  const liveMessages = jarvisState.activity_log.length > 0
    ? activityToMessages(jarvisState.activity_log)
    : null;

  const openViewer = useCallback((src) => {
    const isUrl = /^https?:\/\//.test(src);
    const isPdf = src.toLowerCase().endsWith('.pdf');
    const type  = isUrl ? 'url' : isPdf ? 'pdf' : 'text';
    const title = isUrl
      ? (() => { try { return new URL(src).hostname; } catch { return src; } })()
      : src.split(/[/\\]/).pop();
    setViewer({ type, src, title });
  }, []);

  useEffect(() => {
    const tick = () => {
      const d = new Date();
      setTime(`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`);
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => {
    const id = setInterval(() => {
      setCpu(v => Math.min(95, Math.max(5, v + (Math.random()-0.5)*8)));
      setMem(v => Math.min(95, Math.max(40, v + (Math.random()-0.5)*4)));
    }, 2500);
    return () => clearInterval(id);
  }, []);

  return (
    <div id="root" style={{ display: 'flex', flexDirection: 'column', height: '100vh', overflow: 'hidden' }}>
      <Header
        time={time}
        cpuLoad={Math.round(cpu)}
        memLoad={Math.round(mem)}
        jarvisStatus={jarvisState.status}
        wsConnected={connected}
      />
      <div style={{ flex: 1, display: 'flex', gap: '8px', padding: '8px', overflow: 'hidden', minHeight: 0 }}>
        <LeftPanel activeServer={activeServer} setActiveServer={setActiveServer} />
        <ChatPanel liveMessages={liveMessages} openViewer={openViewer} viewerOpen={!!viewer} />
        {viewer
          ? <ViewerPanel viewer={viewer} onClose={() => setViewer(null)} />
          : <RightPanel calEvents={calEvents} calLoading={calLoading} calError={calError} />
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
