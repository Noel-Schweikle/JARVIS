<style>
/* ============== Jarvis — Holographic HUD ============== */
:root {
  --bg-0: #050516;
  --bg-1: #0a0a2a;
  --ink: #f1f4ff;
  --ink-dim: rgba(241,244,255,0.62);
  --ink-faint: rgba(241,244,255,0.32);
  --hue-a: #6fe6ff;
  --hue-b: #b487ff;
  --hue-c: #ff8fd0;
  --hue-d: #8effc1;
  --hue-e: #ffd58a;
  --iris: linear-gradient(135deg,var(--hue-a) 0%,var(--hue-b) 35%,var(--hue-c) 65%,var(--hue-d) 100%);
  --iris-2: linear-gradient(120deg,#6fe6ff 0%,#b487ff 50%,#ff8fd0 100%);
  --glass-bg: rgba(255,255,255,0.045);
  --glass-bg-strong: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.14);
  --glass-border-strong: rgba(255,255,255,0.22);
  --glass-blur: 24px;
  --font-display: "Space Grotesk","SF Pro Display",system-ui,sans-serif;
  --font-body: "Inter",system-ui,sans-serif;
  --font-mono: "JetBrains Mono","SF Mono",ui-monospace,monospace;
}
* { box-sizing: border-box; }
html,body { margin:0;padding:0;height:100%;overflow:hidden;font-family:var(--font-body);color:var(--ink);background:var(--bg-0);-webkit-font-smoothing:antialiased;letter-spacing:.005em; }
#root { height:100%;width:100%; }

.bg-stage { position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a0a3a 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 10% 90%,#062032 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 90% 10%,#2a0a3a 0%,transparent 70%),linear-gradient(180deg,#050516 0%,#08081f 50%,#050516 100%); }
.bg-stage::before,.bg-stage::after { content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;mix-blend-mode:screen; }
.bg-stage::before { width:60vw;height:60vw;background:radial-gradient(circle,#5b3aff 0%,transparent 70%);top:-10vw;left:-10vw;animation:drift1 32s ease-in-out infinite alternate; }
.bg-stage::after { width:55vw;height:55vw;background:radial-gradient(circle,#00b4d8 0%,transparent 70%);bottom:-15vw;right:-15vw;animation:drift2 38s ease-in-out infinite alternate; }
@keyframes drift1 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(18vw,12vw) scale(1.2)} }
@keyframes drift2 { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-15vw,-8vw) scale(1.15)} }
.stars { position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.7),transparent 50%),radial-gradient(1px 1px at 28% 76%,rgba(255,255,255,.5),transparent 50%),radial-gradient(1.5px 1.5px at 56% 32%,rgba(255,255,255,.8),transparent 50%),radial-gradient(1px 1px at 72% 58%,rgba(255,255,255,.4),transparent 50%),radial-gradient(1px 1px at 84% 14%,rgba(255,255,255,.7),transparent 50%),radial-gradient(1px 1px at 40% 48%,rgba(255,255,255,.6),transparent 50%),radial-gradient(1.5px 1.5px at 22% 38%,rgba(255,255,255,.9),transparent 50%);animation:twinkle 6s ease-in-out infinite alternate; }
@keyframes twinkle { 0%{opacity:.6} 100%{opacity:1} }
.grid-floor { position:absolute;inset:0;background-image:linear-gradient(rgba(111,230,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(111,230,255,.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 60%,black 30%,transparent 80%); }

.glass { background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(140%);backdrop-filter:blur(var(--glass-blur)) saturate(140%);border:1px solid var(--glass-border);border-radius:18px;position:relative;overflow:hidden; }
.glass::before { content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 30%,transparent 70%,rgba(255,255,255,.04) 100%);border-radius:inherit; }
.glass::after { content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(135deg,rgba(111,230,255,.18),transparent 30%,transparent 70%,rgba(255,143,208,.14));mask:linear-gradient(black,black) content-box,linear-gradient(black,black);mask-composite:exclude;-webkit-mask-composite:xor;padding:1px;opacity:.6; }
.glass-strong { background:var(--glass-bg-strong);border-color:var(--glass-border-strong); }

.app-shell { position:relative;z-index:1;height:100vh;width:100vw;display:grid;grid-template-rows:64px 1fr 88px;gap:14px;padding:14px 18px; }
.topbar { display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;height:64px; }
.brand { display:flex;align-items:center;gap:12px;font-family:var(--font-display);letter-spacing:.22em;font-weight:600;font-size:14px; }
.brand-mark { width:28px;height:28px;border-radius:8px;background:var(--iris);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#050516;box-shadow:0 0 24px rgba(111,230,255,.4),inset 0 0 12px rgba(255,255,255,.4); }
.greet { text-align:center;font-family:var(--font-display);font-size:14px;letter-spacing:.16em;color:var(--ink-dim);text-transform:uppercase; }
.greet b { background:var(--iris);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600; }
.status { display:flex;justify-content:flex-end;gap:18px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.12em; }
.status .dot { display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hue-d);margin-right:6px;box-shadow:0 0 12px var(--hue-d);animation:pulse-dot 2s ease-in-out infinite; }
.status .dot.offline { background:rgba(255,100,100,.8);box-shadow:0 0 12px rgba(255,100,100,.5); }
.status .dot.processing { background:var(--hue-e);box-shadow:0 0 12px var(--hue-e); }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.5} }

.stage { position:relative;display:grid;grid-template-columns:320px 1fr 320px;gap:14px;min-height:0; }
.rail { display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto;scrollbar-width:thin; }
.rail-card { padding:12px 16px;cursor:pointer;transition:transform .25s ease,background .25s ease,border-color .25s ease;flex-shrink:0; }
.rail-card:hover { background:var(--glass-bg-strong);border-color:var(--glass-border-strong);transform:translateY(-2px); }
.rail-card .ttl { font-family:var(--font-display);font-size:10px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center; }
.rail-card .ttl span:first-child { display:flex;align-items:center;gap:8px; }
.rail-card .num { font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:-.01em;background:var(--iris);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1; }
.rail-card .sub { font-size:11px;color:var(--ink-dim);margin-top:4px;line-height:1.4; }

.center { position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0; }
.orb-wrap { position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:0; }
.orb-canvas { width:420px;height:420px;max-width:80%;max-height:80%; }
.orb-rings { position:absolute;inset:0;pointer-events:none;display:grid;place-items:center; }
.orb-rings .ring { position:absolute;border:1px solid rgba(255,255,255,.08);border-radius:50%;animation:ring-rot 40s linear infinite; }
.orb-rings .ring.r1 { width:520px;height:520px;border-color:rgba(111,230,255,.16); }
.orb-rings .ring.r2 { width:640px;height:640px;border-color:rgba(180,135,255,.12);animation-duration:60s;animation-direction:reverse; }
.orb-rings .ring.r3 { width:760px;height:760px;border-color:rgba(255,143,208,.10);animation-duration:90s; }
.orb-rings .ring::before { content:"";position:absolute;top:50%;left:-1px;width:8px;height:8px;border-radius:50%;background:var(--hue-a);box-shadow:0 0 16px var(--hue-a);transform:translateY(-50%); }
.orb-rings .ring.r2::before { background:var(--hue-b);box-shadow:0 0 16px var(--hue-b); }
.orb-rings .ring.r3::before { background:var(--hue-c);box-shadow:0 0 16px var(--hue-c); }
@keyframes ring-rot { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

.orb-caption { text-align:center;margin-top:12px; }
.orb-caption .state { font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase; }
.orb-caption .said { font-family:var(--font-display);font-size:18px;color:var(--ink);margin-top:6px;min-height:1.4em;max-width:600px; }

.composer { position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;height:88px; }
.composer .mic-btn,.composer .send-btn { width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--glass-bg-strong);border:1px solid var(--glass-border);cursor:pointer;color:var(--ink);transition:all .2s ease;position:relative; }
.composer .mic-btn:hover,.composer .send-btn:hover { border-color:var(--glass-border-strong);transform:translateY(-1px); }
.composer .mic-btn.active { background:var(--iris);color:#050516;box-shadow:0 0 32px rgba(111,230,255,.5);animation:mic-pulse 1.4s ease-in-out infinite; }
@keyframes mic-pulse { 0%,100%{box-shadow:0 0 32px rgba(111,230,255,.5)} 50%{box-shadow:0 0 48px rgba(180,135,255,.7)} }
.composer input { background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--font-body);font-size:16px;width:100%;padding:0 12px; }
.composer input::placeholder { color:var(--ink-faint);font-style:italic; }

.panel-backdrop { position:fixed;inset:0;background:rgba(5,5,22,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:10;display:grid;place-items:center;animation:fade-in .25s ease; }
@keyframes fade-in { from{opacity:0} to{opacity:1} }
.panel { width:min(1180px,92vw);height:min(760px,88vh);padding:0;display:grid;grid-template-rows:56px 1fr;animation:panel-in .3s cubic-bezier(.2,.9,.3,1.2); }
@keyframes panel-in { from{opacity:0;transform:scale(.96) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
.panel-header { display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 20px;gap:14px;border-bottom:1px solid var(--glass-border);z-index:1; }
.panel-header .badge { width:32px;height:32px;border-radius:10px;background:var(--iris);display:grid;place-items:center;color:#050516;box-shadow:0 0 18px rgba(111,230,255,.4); }
.panel-header .title { font-family:var(--font-display);font-size:16px;letter-spacing:.05em; }
.panel-header .title small { display:block;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);letter-spacing:.18em;text-transform:uppercase;margin-top:2px; }
.panel-header .close { width:36px;height:36px;border-radius:10px;background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--ink);cursor:pointer;display:grid;place-items:center; }
.panel-header .close:hover { background:var(--glass-bg-strong); }
.panel-body { overflow:auto;padding:22px;min-height:0; }

::-webkit-scrollbar { width:10px;height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.08);border-radius:10px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.16); }

.chip { display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase; }
.chip.live { color:var(--hue-d);border-color:rgba(142,255,193,.3); }
.chip.warn { color:var(--hue-e);border-color:rgba(255,213,138,.3); }

/* Drop overlay */
#drop-overlay { display:none;position:fixed;inset:0;z-index:100;background:rgba(5,5,22,.85);backdrop-filter:blur(12px);align-items:center;justify-content:center;flex-direction:column;gap:20px;border:2px dashed var(--hue-a);animation:fade-in .2s ease; }
#drop-overlay.active { display:flex; }
#drop-overlay .drop-icon { font-size:64px; }
#drop-overlay .drop-text { font-family:var(--font-display);font-size:24px;color:var(--hue-a);letter-spacing:.1em; }
#drop-overlay .drop-sub { font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);letter-spacing:.15em; }

/* Upload toast */
#upload-toast { position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:200;padding:12px 24px;border-radius:12px;background:var(--glass-bg-strong);border:1px solid var(--hue-d);color:var(--hue-d);font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;display:none;animation:fade-in .2s ease; }
#upload-toast.show { display:block; }
</style>

<!-- Drop overlay -->
<div id="drop-overlay">
  <div class="drop-icon">🧠</div>
  <div class="drop-text">DATEI INS GEHIRN LADEN</div>
  <div class="drop-sub">LOSLASSEN ZUM HOCHLADEN</div>
</div>

<!-- Drag & drop logic (vanilla, runs before React) -->
<script>
(function(){
  let _dc = 0;
  const overlay = document.getElementById('drop-overlay');
  const toast = document.getElementById('upload-toast');
  function showToast(msg, dur) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), dur || 3000);
  }
  document.addEventListener('dragenter', e => { e.preventDefault(); _dc++; overlay.classList.add('active'); });
  document.addEventListener('dragleave', e => { e.preventDefault(); _dc--; if(_dc<=0){_dc=0;overlay.classList.remove('active');} });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', async e => {
    e.preventDefault(); _dc=0; overlay.classList.remove('active');
    const files = [...e.dataTransfer.files];
    if (!files.length) return;
    for (const f of files) {
      const fd = new FormData(); fd.append('file', f);
      try {
        const r = await fetch('/api/brain/upload', {method:'POST', body:fd});
        const j = await r.json();
        showToast('✓ ' + (j.filename || f.name) + ' gespeichert');
      } catch(err) { showToast('✗ Upload fehlgeschlagen', 4000); }
    }
    if (window.__brainRefresh) window.__brainRefresh();
  });
})();
</script>

<!-- tweaks-panel -->
<script type="text/babel" data-presets="react">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;background:rgba(250,249,247,.78);color:#29261b;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
`;
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}
function TweaksPanel({ title='Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x:16, y:16 });
  React.useEffect(() => {
    const onMsg = e => {
      if (e?.data?.type === '__activate_edit_mode') setOpen(true);
      else if (e?.data?.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, []);
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd"><b>{title}</b><button className="twk-x" onClick={() => setOpen(false)}>✕</button></div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}
function TweakSection({ label, children }) {
  return <><div className="twk-sect">{label}</div>{children}</>;
}
function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value?'1':'0'} onClick={() => onChange(!value)}><i/></button>
    </div>
  );
}
Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakToggle });
</script>

<script type="text/babel" data-presets="react">

const Icons = {

  Gantt: p => <Icon {...p}><rect x="3" y="4" width="9" height="3" rx="1"/><rect x="7" y="10" width="11" height="3" rx="1"/><rect x="5" y="16" width="8" height="3" rx="1"/></Icon>,

<script type="text/babel" data-presets="react">
function Orb({ intensity=0.25, state="idle" }) {
  const mountRef = React.useRef(null);
  const intensityRef = React.useRef(intensity);
  React.useEffect(() => { intensityRef.current = intensity; }, [intensity]);
  React.useEffect(() => {
    if (!mountRef.current || !window.THREE) return;
    const THREE = window.THREE;
    const mount = mountRef.current;
    const w = mount.clientWidth, h = mount.clientHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 100);
    camera.position.set(0,0,4);
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(w,h);
    renderer.setClearColor(0x000000,0);
    mount.appendChild(renderer.domElement);
    const noiseGLSL = `
      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;
        vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
        i=mod289(i);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
    `;
    const sphereGeom = new THREE.IcosahedronGeometry(1.0, 64);
    const sphereMat = new THREE.ShaderMaterial({
      transparent:true, side:THREE.DoubleSide,
      uniforms:{ uTime:{value:0}, uIntensity:{value:intensityRef.current} },
      vertexShader:`varying vec3 vNormal;varying vec3 vPos;varying float vDisp;uniform float uTime;uniform float uIntensity;${noiseGLSL}
        void main(){vec3 p=position;float n=snoise(p*1.4+vec3(uTime*0.18));float n2=snoise(p*2.7+vec3(uTime*0.32,0.0,0.0));

      fragmentShader:`varying vec3 vNormal;varying vec3 vPos;varying float vDisp;uniform float uTime;uniform float uIntensity;

        void main(){vec3 viewDir=normalize(-vPos);float fres=pow(1.0-max(dot(vNormal,viewDir),0.0),2.2);
        float angle=atan(vNormal.y,vNormal.x);float t=angle*0.16+vDisp*1.5+uTime*0.08;
        vec3 iridescent=pal(t);vec3 color=mix(iridescent*0.3,iridescent*1.4,fres);color+=vec3(0.05,0.1,0.2);
        float alpha=mix(0.32,0.78,fres)*(0.7+uIntensity*0.4);gl_FragColor=vec4(color,alpha);}`,
    });
    const sphere = new THREE.Mesh(sphereGeom, sphereMat);
    scene.add(sphere);
    const coreGeom = new THREE.IcosahedronGeometry(0.55, 32);
    const coreMat = new THREE.ShaderMaterial({
      transparent:true,
      uniforms:{ uTime:{value:0}, uIntensity:{value:intensityRef.current} },
      vertexShader:`varying vec3 vNormal;varying vec3 vPos;uniform float uTime;uniform float uIntensity;${noiseGLSL}
        void main(){vec3 p=position;float n=snoise(p*2.0+uTime*0.35);p+=normal*n*(0.06+uIntensity*0.25);

      fragmentShader:`varying vec3 vNormal;varying vec3 vPos;uniform float uTime;uniform float uIntensity;
        void main(){vec3 viewDir=normalize(-vPos);float fres=pow(1.0-max(dot(vNormal,viewDir),0.0),1.6);
        vec3 cyan=vec3(0.43,0.9,1.0);vec3 violet=vec3(0.71,0.53,1.0);
        vec3 col=mix(cyan,violet,0.5+0.5*sin(uTime*0.7));col*=(0.6+uIntensity*1.6);
        float alpha=fres*(0.5+uIntensity*0.5);gl_FragColor=vec4(col,alpha);}`,
    });
    const core = new THREE.Mesh(coreGeom, coreMat);
    scene.add(core);
    const haloGeom = new THREE.IcosahedronGeometry(1.18, 2);
    const haloMat = new THREE.MeshBasicMaterial({ color:0x6fe6ff, wireframe:true, transparent:true, opacity:0.18 });
    const halo = new THREE.Mesh(haloGeom, haloMat);
    scene.add(halo);
    const dustCount = 600;
    const dustPos = new Float32Array(dustCount*3);
    for (let i=0;i<dustCount;i++) {
      const r=1.5+Math.random()*1.4, theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
      dustPos[i*3]=r*Math.sin(phi)*Math.cos(theta); dustPos[i*3+1]=r*Math.sin(phi)*Math.sin(theta); dustPos[i*3+2]=r*Math.cos(phi);
    }
    const dustGeom = new THREE.BufferGeometry();
    dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos,3));
    const dustMat = new THREE.PointsMaterial({ color:0xb487ff, size:0.03, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending, depthWrite:false });
    const dust = new THREE.Points(dustGeom, dustMat);
    scene.add(dust);
    let raf;
    const clock = new THREE.Clock();
    const animate = () => {
      const t = clock.getElapsedTime();
      sphereMat.uniforms.uTime.value = t; coreMat.uniforms.uTime.value = t;
      const target = intensityRef.current;
      sphereMat.uniforms.uIntensity.value += (target - sphereMat.uniforms.uIntensity.value)*0.08;
      coreMat.uniforms.uIntensity.value = sphereMat.uniforms.uIntensity.value;
      sphere.rotation.y=t*0.18; sphere.rotation.x=Math.sin(t*0.15)*0.2;
      core.rotation.y=-t*0.35; core.rotation.z=t*0.18;
      halo.rotation.y=t*0.12; halo.rotation.x=-t*0.08;
      dust.rotation.y=t*0.04; dust.rotation.x=t*0.02;
      renderer.render(scene,camera); raf=requestAnimationFrame(animate);
    };
    animate();
    const ro = new ResizeObserver(() => {
      const W=mount.clientWidth, H=mount.clientHeight;
      camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H);
    });
    ro.observe(mount);
    return () => {
      cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose();
      sphereGeom.dispose(); sphereMat.dispose(); coreGeom.dispose(); coreMat.dispose();
      haloGeom.dispose(); haloMat.dispose(); dustGeom.dispose(); dustMat.dispose();
      if (renderer.domElement.parentNode===mount) mount.removeChild(renderer.domElement);
    };
  }, []);
  return (
    <div className="orb-wrap">
      <div className="orb-rings"><div className="ring r1"/><div className="ring r2"/><div className="ring r3"/></div>
      <div ref={mountRef} className="orb-canvas"/>
    </div>
  );
}
window.Orb = Orb;
</script>

<script type="text/babel" data-presets="react">
const { useState: useS, useEffect: useE, useRef: useR } = React;

/* ---------- MORNING BRIEFING (real calendar + weather) ---------- */
function MorningBriefing({ calEvents=[], calLoading=false }) {
  const now = new Date();
  const time = now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const date = now.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const [weather, setWeather] = useS(null);
  useE(() => {
    fetch("https://wttr.in/Munich?format=j1")
      .then(r=>r.json())
      .then(d=>{
        const c=d.current_condition?.[0];
        if(c) setWeather({temp:c.temp_C, desc:c.weatherDesc?.[0]?.value||""});
      }).catch(()=>{});
  }, []);
  const todayEvents = calEvents.filter(e => {
    const d = new Date(e.start?.dateTime || e.start?.date || e.start);
    return d.toDateString() === now.toDateString();
  });
  const hueColors = ["var(--hue-a)","var(--hue-b)","var(--hue-d)","var(--hue-c)"];
  return (
    <div style={{display:"grid",gridTemplateColumns:"1.2fr 1fr",gridTemplateRows:"auto 1fr",gap:16,height:"100%"}}>
      <div className="glass glass-strong" style={{gridColumn:"1 / -1",padding:"24px 28px",display:"grid",gridTemplateColumns:"1fr auto",alignItems:"center"}}>
        <div>
          <div style={{fontFamily:"var(--font-mono)",fontSize:11,letterSpacing:".22em",color:"var(--ink-faint)",textTransform:"uppercase"}}>{date}</div>
          <div style={{fontFamily:"var(--font-display)",fontSize:36,fontWeight:300,marginTop:8,lineHeight:1.15}}>
            Guten Morgen, <b style={{background:"var(--iris)",WebkitBackgroundClip:"text",backgroundClip:"text",color:"transparent",fontWeight:600}}>Sir</b>.
          </div>
          <div style={{fontSize:14,color:"var(--ink-dim)",marginTop:6,maxWidth:640}}>
            {calLoading ? "Kalender wird geladen…" : `Sie haben heute ${todayEvents.length} Termine.`}
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"auto auto",gap:18,alignItems:"center"}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"var(--font-display)",fontSize:56,fontWeight:300,lineHeight:1,letterSpacing:"-0.02em"}}>{time}</div>
            <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--ink-faint)",letterSpacing:".2em",marginTop:4}}>MÜNCHEN · CET</div>
          </div>
          <div style={{padding:"14px 18px",borderRadius:14,background:"rgba(111,230,255,.06)",border:"1px solid rgba(111,230,255,.18)",display:"grid",gridTemplateColumns:"auto auto",gap:14,alignItems:"center"}}>
            <Icons.Sparkle size={36} stroke="var(--hue-a)" sw={1.2}/>
            <div>
              <div style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:300,lineHeight:1}}>{weather ? weather.temp+"°" : "—"}</div>
              <div style={{fontSize:11,color:"var(--ink-faint)",marginTop:4}}>{weather ? weather.desc : "Lädt…"}</div>
            </div>
          </div>
        </div>
      </div>
      <div className="glass" style={{padding:18,overflow:"auto"}}>
        <SectionHeader icon={<Icons.Calendar size={14}/>} title="Termine" sub={`Heute · ${todayEvents.length}`}/>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:14}}>
          {todayEvents.length===0 && !calLoading && <div style={{color:"var(--ink-faint)",fontSize:13,padding:"20px 0",textAlign:"center"}}>Keine Termine heute</div>}
          {todayEvents.map((e,i)=>{
            const start = e.start?.dateTime ? new Date(e.start.dateTime).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : e.start?.date || "";
            return (
              <div key={i} style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:14,padding:"12px 14px",borderRadius:12,background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)",position:"relative"}}>
                <div style={{position:"absolute",left:0,top:8,bottom:8,width:3,borderRadius:2,background:hueColors[i%4]}}/>
                <div style={{paddingLeft:8,fontFamily:"var(--font-mono)",fontSize:13,color:"var(--ink)"}}>{start}</div>
                <div>
                  <div style={{fontFamily:"var(--font-display)",fontSize:14}}>{e.summary||e.title||"Termin"}</div>
                  <div style={{fontSize:11,color:"var(--ink-faint)",marginTop:2}}>{e.location||""}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateRows:"1fr",gap:16,minHeight:0}}>
        <div className="glass" style={{padding:18,overflow:"auto"}}>
          <SectionHeader icon={<Icons.Globe size={14}/>} title="Briefing" sub="Heute"/>
          <div style={{marginTop:12,color:"var(--ink-dim)",fontSize:13,lineHeight:1.6}}>
            Klicken Sie auf <b style={{color:"var(--ink)"}}>„Briefing"</b> in der Eingabe um ein vollständiges Morning Briefing von JARVIS zu erhalten — mit Wetter, Nachrichten und Aufgaben.
          </div>
        </div>
      </div>
    </div>
  );
}

              </div>
            </div>
          )}
        </div>
      </div>
      <div className="glass glass-strong" style={{display:"grid",gridTemplateColumns:"1fr auto",gap:8,padding:8,alignItems:"center"}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Nachricht an JARVIS…"
          style={{background:"transparent",border:"none",outline:"none",color:"var(--ink)",fontFamily:"var(--font-body)",fontSize:15,padding:"10px 14px"}}/>

          <Icons.Send size={14} stroke="#050516"/> Senden

}

/* ---------- BRAIN MODULE ---------- */
function BrainModule() {
  const [files, setFiles] = useS([]);
  const [loading, setLoading] = useS(true);
  const [deleting, setDeleting] = useS(null);
  const load = () => {
    setLoading(true);
    fetch("/api/brain/list").then(r=>r.json()).then(d=>{ setFiles(d.files||[]); setLoading(false); }).catch(()=>setLoading(false));
  };
  useE(()=>{ load(); window.__brainRefresh = load; return ()=>{ delete window.__brainRefresh; }; },[]);
  const extColor = { pdf:"var(--hue-c)", txt:"var(--hue-a)", md:"var(--hue-a)", py:"var(--hue-e)", js:"var(--hue-e)", json:"var(--hue-e)", png:"var(--hue-b)", jpg:"var(--hue-b)", jpeg:"var(--hue-b)", csv:"var(--hue-d)", docx:"var(--hue-b)" };
  const getExt = n => (n.split(".").pop()||"").toLowerCase();
  const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : b>1024 ? (b/1024).toFixed(0)+" KB" : b+" B";
  const del = async (name) => {
    setDeleting(name);
    await fetch(`/api/brain/file?name=${encodeURIComponent(name)}`,{method:"DELETE"});
    setDeleting(null); load();
  };
  return (
    <div style={{display:"grid",gridTemplateRows:"auto 1fr auto",height:"100%",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontFamily:"var(--font-mono)",fontSize:11,color:"var(--ink-faint)",letterSpacing:".15em",textTransform:"uppercase"}}>WISSENSBASIS</div>
          <div style={{fontFamily:"var(--font-display)",fontSize:22,marginTop:2}}>Gehirn · {files.length} Dateien</div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <span className="chip live">● aktiv</span>
          <span className="chip">Drag & Drop zum Hochladen</span>
        </div>
      </div>
      <div className="glass" style={{overflow:"auto",padding:"8px 0"}}>
        {loading && <div style={{textAlign:"center",padding:40,color:"var(--ink-faint)",fontFamily:"var(--font-mono)",fontSize:12}}>Lädt…</div>}
        {!loading && files.length===0 && (
          <div style={{textAlign:"center",padding:"60px 20px",color:"var(--ink-faint)"}}>
            <div style={{fontSize:48,marginBottom:16}}>🧠</div>
            <div style={{fontFamily:"var(--font-display)",fontSize:16,marginBottom:8}}>Gehirn ist leer</div>
            <div style={{fontSize:13}}>Dateien per Drag & Drop auf die Seite ziehen</div>
          </div>
        )}
        {files.map((f,i)=>{
          const ext=getExt(f.name); const col=extColor[ext]||"var(--ink-faint)";
          return (
            <div key={i} style={{display:"grid",gridTemplateColumns:"auto 1fr auto auto",gap:14,alignItems:"center",padding:"12px 18px",borderBottom:"1px solid rgba(255,255,255,.04)"}}>
              <span style={{width:32,height:32,display:"grid",placeItems:"center",borderRadius:8,background:`${col}22`,fontFamily:"var(--font-mono)",fontSize:9,fontWeight:600,color:col,letterSpacing:0,flexShrink:0}}>
                {ext.slice(0,4).toUpperCase()||"?"}
              </span>
              <div>
                <div style={{fontSize:13,fontFamily:"var(--font-display)"}}>{f.name}</div>
                <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--ink-faint)",marginTop:2}}>{fmtSize(f.size)} · {new Date(f.modified*1000).toLocaleDateString("de-DE")}</div>
              </div>
              <span style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--ink-faint)"}}>{fmtSize(f.size)}</span>
              <button onClick={()=>del(f.name)} disabled={deleting===f.name} style={{background:"transparent",border:"1px solid rgba(255,255,255,.08)",borderRadius:8,padding:"6px 8px",cursor:"pointer",color:"var(--hue-c)",display:"flex",alignItems:"center",gap:4,opacity:deleting===f.name?0.4:1}}>
                <Icons.Trash size={13} stroke="var(--hue-c)"/>
              </button>
            </div>
          );
        })}
      </div>
      <div className="glass" style={{padding:"12px 18px",display:"flex",gap:12,alignItems:"center"}}>
        <Icons.Brain size={16} stroke="var(--hue-b)"/>
        <div style={{fontSize:13,color:"var(--ink-dim)"}}>JARVIS kann auf alle Dateien zugreifen. Fragen Sie: <b style={{color:"var(--ink)"}}>„Was ist in meinem Gehirn?"</b></div>
      </div>
    </div>
  );
}

          <div style={{overflow:"auto",padding:"16px 22px",fontSize:14,lineHeight:1.7,color:"var(--ink-dim)",whiteSpace:"pre-wrap"}}>{doc}</div>
        </div>
      </div>
    </div>
  );
}

/* ---------- MIND MAP ---------- */
function MindMapModule() {
  const W=1100,H=600,cx=W/2,cy=H/2;
  const branches=[{id:"a",label:"Sprachsteuerung",color:"var(--hue-b)",children:["Wake Word","TTS","Multi-Lang"]},{id:"b",label:"Holographic UI",color:"var(--hue-c)",children:["Glassmorphism","3D Orb","Iridescence"]},{id:"c",label:"Tools",color:"var(--hue-d)",children:["Kalender","GitHub","Gehirn"]},{id:"d",label:"Intelligence",color:"var(--hue-e)",children:["Briefing","Memory","Agents"]}];
  return (
    <div className="glass" style={{height:"100%",position:"relative",overflow:"hidden"}}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" style={{width:"100%",height:"100%"}}>
        {branches.map((b,i)=>{
          const angle=(i/branches.length)*Math.PI*2-Math.PI/2;
          const bx=cx+Math.cos(angle)*200, by=cy+Math.sin(angle)*200;
          return (
            <g key={b.id}>
              <line x1={cx} y1={cy} x2={bx} y2={by} stroke={b.color} strokeWidth="1.5" opacity=".5"/>
              <circle cx={bx} cy={by} r={52} fill="rgba(8,8,31,.85)" stroke={b.color} strokeWidth="1.5" style={{filter:`drop-shadow(0 0 12px ${b.color})`}}/>
              <text x={bx} y={by} textAnchor="middle" dominantBaseline="middle" fontFamily="var(--font-display)" fontSize="11" fill="var(--ink)">{b.label}</text>
              {b.children.map((c,j)=>{
                const span=0.7, ca=angle+(j-(b.children.length-1)/2)*(span/b.children.length);
                const ccx=cx+Math.cos(ca)*360, ccy=cy+Math.sin(ca)*360;
                return (
                  <g key={j}>
                    <line x1={bx} y1={by} x2={ccx} y2={ccy} stroke={b.color} strokeWidth="1" opacity=".35"/>
                    <circle cx={ccx} cy={ccy} r={34} fill="rgba(8,8,31,.85)" stroke={b.color} strokeWidth="1"/>
                    <text x={ccx} y={ccy} textAnchor="middle" dominantBaseline="middle" fontFamily="var(--font-display)" fontSize="9" fill="var(--ink-dim)">{c}</text>
                  </g>
                );
              })}
            </g>
          );
        })}
        <circle cx={cx} cy={cy} r={72} fill="rgba(8,8,31,.9)" stroke="var(--hue-a)" strokeWidth="2" style={{filter:"drop-shadow(0 0 18px var(--hue-a))"}}/>
        <text x={cx} y={cy} textAnchor="middle" dominantBaseline="middle" fontFamily="var(--font-display)" fontSize="14" fontWeight="600" fill="var(--ink)">JARVIS</text>
      </svg>
    </div>
  );
}

Object.assign(window, { MorningBriefing, ChatVoice, BrainModule, GitHubModule, GanttModule, MindMapModule, TextEditorModule });
</script>

<!-- app -->
<script type="text/babel" data-presets="react">
(function(){
const { useState, useEffect, useRef } = React;

const ALL_TOOLS = [
  { id:"briefing", name:"Morning Briefing", short:"BRIEF", icon:"Sunrise",  side:"left",  num:"—",  sub:"Tages-Überblick" },
  { id:"chat",     name:"Chat",             short:"CHAT",  icon:"Sparkle",  side:"left",  num:"—",  sub:"Assistent" },
  { id:"brain",    name:"Gehirn",           short:"BRAIN", icon:"Brain",    side:"left",  num:"—",  sub:"Wissensbasis" },
  { id:"editor",   name:"Text Editor",      short:"EDIT",  icon:"Edit",     side:"left",  num:"—",  sub:"Markdown" },
  { id:"viewer",   name:"3D Viewer",        short:"3D",    icon:"Cube",     side:"right", num:"5",  sub:"Modelle geladen" },
  { id:"github",   name:"GitHub",           short:"GH",    icon:"Github",   side:"right", num:"3",  sub:"PRs offen" },
  { id:"mindmap",  name:"Mind Map",         short:"MIND",  icon:"Globe",    side:"right", num:"12", sub:"Knoten aktiv" },
  { id:"gantt",    name:"Gantt",            short:"GANTT", icon:"Gantt",    side:"right", num:"78%",sub:"Phase 2 · on track" },
];

const TWEAK_DEFAULTS = {
  tools: { briefing:true, chat:true, brain:true, editor:true, viewer:true, github:true, mindmap:true, gantt:true }
};

function useJarvisWS() {
  const [jarvisState, setJarvisState] = useState({ status:"offline", activity_log:[], stats:{} });
  const [connected, setConnected] = useState(false);
  const wsRef = useRef(null);
  const reconnectRef = useRef(null);
  const connect = () => {
    try {
      const ws = new WebSocket(`ws://${location.host}/ws`);
      wsRef.current = ws;
      ws.onopen = () => { setConnected(true); if(reconnectRef.current) clearTimeout(reconnectRef.current); };
      ws.onclose = () => { setConnected(false); reconnectRef.current = setTimeout(connect, 3500); };
      ws.onerror = () => ws.close();
      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "state_update") setJarvisState(msg.data);
        } catch(err) {}
      };
    } catch(err) { reconnectRef.current = setTimeout(connect, 3500); }
  };
  useEffect(() => {
    connect();
    return () => { if(wsRef.current) wsRef.current.close(); if(reconnectRef.current) clearTimeout(reconnectRef.current); };
  }, []);
  return { jarvisState, connected };
}

function useCalendar() {
  const [calEvents, setCalEvents] = useState([]);
  const [calLoading, setCalLoading] = useState(true);
  const [calError, setCalError] = useState(null);
  const load = () => {
    fetch("/api/calendar").then(r=>r.json()).then(d=>{ setCalEvents(d.events||[]); setCalLoading(false); }).catch(err=>{ setCalError(err.message); setCalLoading(false); });
  };
  useEffect(() => { load(); const id=setInterval(load,60000); return ()=>clearInterval(id); }, []);
  return { calEvents, calLoading, calError };
}

function activityToMessages(log) {
  return [...log].reverse()
    .filter(item => ["user","assistant","tool"].includes(item.type))
    .map(item => ({
      id: item.id,
      role: item.type==="user" ? "user" : item.type==="tool" ? "tool" : "jarvis",
      text: item.content,
      tool: item.tool,
      ts: new Date(item.timestamp).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}),
    }));
}

/* ---- PCM AudioWorklet (runs inside AudioContext, loaded via blob URL) ---- */
const _WORKLET_SRC = `
class PcmCapture extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) {
      const s16 = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++)
        s16[i] = Math.max(-32768, Math.min(32767, ch[i] * 32768));
      this.port.postMessage(s16.buffer, [s16.buffer]);
    }
    return true;
  }
}
registerProcessor('pcm-capture', PcmCapture);
`;

function useVoiceWS({ onIntensity, onCaption }) {
  const wsRef = useRef(null);
  const audioCtxRef = useRef(null);
  const streamRef = useRef(null);
  const workletRef = useRef(null);
  const nextPlayRef = useRef(0);
  const [active, setActive] = useState(false);
  const [error, setError] = useState(null);

  const start = async () => {
    setError(null);
    try {
      // 24 kHz AudioContext — matches Realtime API format
      const audioCtx = new AudioContext({ sampleRate: 24000 });
      audioCtxRef.current = audioCtx;
      nextPlayRef.current = audioCtx.currentTime;

      // Load inline worklet via blob URL
      const blob = new Blob([_WORKLET_SRC], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(blobUrl);
      URL.revokeObjectURL(blobUrl);

      // Capture microphone
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 24000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      streamRef.current = stream;

      const src = audioCtx.createMediaStreamSource(stream);
      const worklet = new AudioWorkletNode(audioCtx, 'pcm-capture');
      src.connect(worklet);
      workletRef.current = worklet;

      // Connect to backend
      const ws = new WebSocket(`ws://${location.host}/ws/voice`);
      wsRef.current = ws;

      ws.onopen = () => {
        setActive(true);
        // Send mic audio to backend
        worklet.port.onmessage = (e) => {
          if (ws.readyState === WebSocket.OPEN) ws.send(e.data);
        };
      };

      ws.onclose = () => { setActive(false); _cleanup(); };
      ws.onerror = () => { setError('Verbindung fehlgeschlagen'); setActive(false); _cleanup(); };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'audio') {
          // Decode base64 PCM16 → Float32 → schedule playback
          const raw = atob(msg.data);
          const s16 = new Int16Array(raw.length / 2);
          for (let i = 0; i < s16.length; i++)
            s16[i] = (raw.charCodeAt(i * 2)) | (raw.charCodeAt(i * 2 + 1) << 8);
          const f32 = new Float32Array(s16.length);
          for (let i = 0; i < s16.length; i++) f32[i] = s16[i] / 32768;
          const buf = audioCtx.createBuffer(1, f32.length, 24000);
          buf.copyToChannel(f32, 0);
          const src2 = audioCtx.createBufferSource();
          src2.buffer = buf;
          src2.connect(audioCtx.destination);
          const playAt = Math.max(audioCtx.currentTime + 0.02, nextPlayRef.current);
          src2.start(playAt);
          nextPlayRef.current = playAt + buf.duration;
          onIntensity?.(0.65 + Math.random() * 0.3);
        } else if (msg.type === 'speech_started') {
          onIntensity?.(0.85);
        } else if (msg.type === 'speech_stopped') {
          onIntensity?.(0.3);
        } else if (msg.type === 'transcript_delta') {
          onCaption?.(msg.text, 'delta');
        } else if (msg.type === 'user_transcript') {
          onCaption?.(msg.text, 'user');
        } else if (msg.type === 'jarvis_transcript') {
          onCaption?.(msg.text, 'jarvis');
        } else if (msg.type === 'done') {
          onIntensity?.(0.25);
          onCaption?.('', 'reset');
        } else if (msg.type === 'error') {
          setError(msg.message);
        }
      };
    } catch (err) {
      setError(err.message || 'Mikrofon-Zugriff verweigert');
      _cleanup();
    }
  };

  const stop = () => {
    wsRef.current?.close();
    _cleanup();
    setActive(false);
  };

  const _cleanup = () => {
    workletRef.current?.disconnect();
    streamRef.current?.getTracks().forEach(t => t.stop());
    audioCtxRef.current?.close();
    workletRef.current = null; streamRef.current = null; audioCtxRef.current = null;
  };

  return { start, stop, active, error };
}

function renderOpenModule(id, props) {
  if (id==="briefing") return <MorningBriefing calEvents={props.calEvents} calLoading={props.calLoading}/>;
  if (id==="chat")     return <ChatVoice messages={props.liveMessages} onSend={props.onSend} thinking={props.thinking}/>;
  if (id==="brain")    return <BrainModule/>;
  if (id==="editor")   return <TextEditorModule/>;
  if (id==="viewer")   return <Viewer3D/>;
  if (id==="github")   return <GitHubModule/>;
  if (id==="mindmap")  return <MindMapModule/>;
  if (id==="gantt")    return <GanttModule/>;
  return null;
}

function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const [openModule, setOpenModule] = useState("briefing");
  const [voiceIntensity, setVoiceIntensity] = useState(0.25);
  const [voiceCaption, setVoiceCaption] = useState("");
  const [inlineInput, setInlineInput] = useState("");
  const [thinking, setThinking] = useState(false);
  const [now, setNow] = useState(new Date());
  const { jarvisState, connected } = useJarvisWS();
  const { calEvents, calLoading } = useCalendar();
  const liveMessages = activityToMessages(jarvisState.activity_log || []);

  const { start: voiceStart, stop: voiceStop, active: listening, error: voiceError } = useVoiceWS({
    onIntensity: setVoiceIntensity,
    onCaption: (text, type) => {
      if (type === 'delta') setVoiceCaption(c => c + text);
      else if (type === 'user') setVoiceCaption(text);
      else if (type === 'jarvis') setVoiceCaption(text);
      else if (type === 'reset') setVoiceCaption("");
    },
  });

  // Orb intensity decay when not speaking
  useEffect(() => {
    if (listening) return;
    const id = setInterval(() => setVoiceIntensity(v => Math.max(0.18, v * 0.93)), 60);
    return () => clearInterval(id);
  }, [listening]);

  useEffect(() => { const id=setInterval(()=>setNow(new Date()),30000); return ()=>clearInterval(id); }, []);

  const onSend = async (text) => {
    setThinking(true);
    try {
      await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:text}) });
    } catch(err) { console.error("Chat error:", err); }
    setThinking(false);
  };

  const onInlineSend = () => {
    if (!inlineInput.trim()) return;
    onSend(inlineInput);
    setInlineInput("");
    setOpenModule("chat");
  };

  const tools = ALL_TOOLS.filter(tool => t.tools[tool.id]);
  const leftTools = tools.filter(x=>x.side==="left");
  const rightTools = tools.filter(x=>x.side==="right");
  const time = now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const greet = now.getHours()<11 ? "Guten Morgen" : now.getHours()<18 ? "Guten Tag" : "Guten Abend";
  const openComp = openModule ? ALL_TOOLS.find(x=>x.id===openModule) : null;
  const jarvisStatus = !connected ? "offline" : jarvisState.status || "idle";
  const statusLabel = jarvisStatus==="offline" ? "OFFLINE" : jarvisStatus==="processing" ? "● VERARBEITUNG" : "● SYSTEM BEREIT";
  const lastMsg = liveMessages.length>0 ? liveMessages[liveMessages.length-1] : null;

  return (
    <>
      <div className="app-shell">
        <div className="topbar glass">
          <div className="brand">
            <span className="brand-mark">J</span>
            <span>JARVIS · 2.0</span>
          </div>
          <div className="greet">{greet}, <b>Sir</b></div>
          <div className="status">
            <span>
              <span className={`dot ${jarvisStatus}`}/>
              {statusLabel}
            </span>
            <span style={{fontFamily:"var(--font-display)",fontSize:16,color:"var(--ink)"}}>{time}</span>
          </div>
        </div>

        <div className="stage">
          <div className="rail">
            {leftTools.map(tool => {
              const I = Icons[tool.icon];
              return (
                <div key={tool.id} className="glass rail-card" onClick={()=>setOpenModule(tool.id)}>
                  <div className="ttl"><span><I size={12}/> {tool.short}</span><span>›</span></div>
                  <div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:2}}>
                    <span className="num">{tool.num}</span>
                    <span style={{fontFamily:"var(--font-display)",fontSize:13,color:"var(--ink)"}}>{tool.name}</span>
                  </div>
                  <div className="sub">{tool.sub}</div>
                </div>
              );
            })}
            <div className="glass rail-card" style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",cursor:"default"}}>
              <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--ink-faint)",letterSpacing:".18em",marginBottom:8}}>SYSTEM</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {[["STATUS",connected?"ONLINE":"OFFLINE"],["MODEL","GPT-4o"],["WS",connected?"OK":"—"],["LOG",(jarvisState.activity_log||[]).length+""]].map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"4px 8px",borderRadius:6,background:"rgba(255,255,255,.025)"}}>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:9,color:"var(--ink-faint)",letterSpacing:".12em"}}>{k}</span>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:k==="STATUS"&&!connected?"var(--hue-c)":"var(--ink)"}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="center">
            <Orb intensity={voiceIntensity} state={listening?"listening":"idle"}/>
            <div className="orb-caption">
              <div className="state">
                {listening ? "● ZUHÖREN" : thinking ? "● DENKT…" : voiceError ? "⚠ FEHLER" : "BEREIT"}
              </div>
              <div className="said">
                {voiceError
                  ? voiceError
                  : voiceCaption
                  ? voiceCaption.slice(0,140)+(voiceCaption.length>140?"…":"")
                  : lastMsg
                  ? lastMsg.text.slice(0,120)+(lastMsg.text.length>120?"…":"")
                  : "Wie kann ich helfen, Sir?"}
              </div>
            </div>
          </div>

          <div className="rail">
            {rightTools.map(tool => {
              const I = Icons[tool.icon];
              return (
                <div key={tool.id} className="glass rail-card" onClick={()=>setOpenModule(tool.id)}>
                  <div className="ttl"><span><I size={12}/> {tool.short}</span><span>›</span></div>
                  <div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:2}}>
                    <span className="num">{tool.num}</span>
                    <span style={{fontFamily:"var(--font-display)",fontSize:13,color:"var(--ink)"}}>{tool.name}</span>
                  </div>
                  <div className="sub">{tool.sub}</div>
                </div>
              );
            })}
            <div className="glass rail-card" style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",cursor:"default"}}>
              <div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"var(--ink-faint)",letterSpacing:".18em",marginBottom:8}}>SENSOREN</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {[["MIC",listening?"ON":"OFF"],["CAM","OFF"],["LAT","—"],["CAL",calLoading?"…":calEvents.length+""]].map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",padding:"4px 8px",borderRadius:6,background:"rgba(255,255,255,.025)"}}>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:9,color:"var(--ink-faint)",letterSpacing:".12em"}}>{k}</span>
                    <span style={{fontFamily:"var(--font-mono)",fontSize:11,color:k==="MIC"&&listening?"var(--hue-d)":"var(--ink)"}}>{v}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        <div className="composer glass glass-strong">
          <button
            className={`mic-btn ${listening?"active":""}`}
            onClick={()=>{ listening ? voiceStop() : voiceStart(); }}
            title={listening?"Mikrofon stoppen":"Mikrofon starten"}
          >
            <Icons.Mic size={22} stroke={listening?"#050516":"var(--ink)"}/>
          </button>
          <input
            value={inlineInput}
            onChange={e=>setInlineInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&onInlineSend()}
            placeholder="Sprechen Sie mit JARVIS… oder drücken Sie das Mikrofon"
          />
          <button className="send-btn" title="Chat öffnen" onClick={()=>{ if(inlineInput.trim()) onInlineSend(); else setOpenModule("chat"); }}>
            <Icons.Sparkle size={22} stroke="var(--hue-a)"/>
          </button>
        </div>
      </div>

      {openComp && (
        <div className="panel-backdrop" onClick={e=>{ if(e.target.classList.contains("panel-backdrop")) setOpenModule(null); }}>
          <div className="panel glass glass-strong">
            <div className="panel-header">
              <span className="badge">
                {openComp.icon && React.createElement(Icons[openComp.icon],{size:16,stroke:"#050516"})}
              </span>
              <div className="title">
                {openComp.name}
                <small>{openComp.short} · {openComp.sub}</small>
              </div>
              <button className="close" onClick={()=>setOpenModule(null)} aria-label="Schließen">
                <Icons.X size={16}/>
              </button>
            </div>
            <div className="panel-body">
              {renderOpenModule(openModule, { calEvents, calLoading, liveMessages, onSend, thinking })}
            </div>
          </div>
        </div>
      )}

      <TweaksPanel title="Tools">
        <TweakSection label="Sichtbare Tools">
          {ALL_TOOLS.map(tool=>(
            <TweakToggle key={tool.id} label={tool.name} value={t.tools[tool.id]} onChange={v=>setT({tools:{...t.tools,[tool.id]:v}})}/>
          ))}
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
})();
</script>
